name: Build + tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-test:
    name: Build + tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 10

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20
          cache: pnpm

      - name: Install deps
        run: pnpm install --frozen-lockfile

      # `build` runs `tsc`, which type-checks AND emits build/ — guaranteeing the
      # published artifact matches src. Catches the src/build drift that
      # previously shipped a stale tool set.
      - name: Build
        run: pnpm build

      - name: Run tests
        run: pnpm test
