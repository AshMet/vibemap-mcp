name: Publish (provenance)

# Opt-in, provenance-enabled publish path for @vibemap.ai/mcp-server. Manual-only
# so it never fires unexpectedly. Publishing from CI with OIDC (`id-token: write`)
# lets npm attach a signed provenance attestation that links the published tarball
# to this repo + commit, which a local `npm publish` cannot produce.
#
# Requires repo secret NPM_TOKEN: a granular, 2FA-bypass automation token scoped
# to the @vibemap.ai org with publish rights. Until that secret exists this
# workflow is inert; the existing manual `pnpm build && npm publish` path keeps
# working.
on:
  workflow_dispatch:
    inputs:
      confirm:
        description: "Type 'publish' to confirm a real npm publish"
        required: true
        default: ""

permissions:
  contents: read
  id-token: write # required for npm provenance attestation

jobs:
  publish:
    name: Build, test & publish with provenance
    if: ${{ github.event.inputs.confirm == 'publish' }}
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # pnpm 11, resolved from the `packageManager` field in package.json — see
      # .github/workflows/test.yml for why the pin moved off pnpm/action-setup's
      # `version: 10` (D-296). actions/setup-node still runs below and wins on
      # PATH, because `npm publish` needs the registry npmrc it writes.
      - uses: pnpm/setup@84cb39b217b10273981911c288cd62326dc7c6d2 # v2.0.2
        with:
          runtime: node@20
          cache: true
          install: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20
          registry-url: "https://registry.npmjs.org"

      - name: Install deps
        run: pnpm install --frozen-lockfile

      # The published tarball must be built from a tree whose security pins
      # actually applied. Last gate before npm publish.
      - name: Assert dependency overrides applied
        run: pnpm run assert:overrides

      - name: Build
        run: pnpm build

      - name: Test
        run: pnpm test

      # npm (not pnpm) publish keeps provenance generation on the well-trodden
      # path; --access public matches package.json publishConfig.
      - name: Publish with provenance
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
